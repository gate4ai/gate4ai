name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # contract: манифесты прошлого тега
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # SPDX, направление зависимостей (scripts/deps-check.sh), сборка, vet, тесты, WASM.
      - run: ./scripts/ci.sh
      # Действия для других коннекторов: несовместимое изменение — только с новым contract.
      - name: contract
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          [ -n "$prev" ] || exit 0
          go build -o "$RUNNER_TEMP/gate4ai" ./cmd/gate4ai
          for m in connectors/*/manifest.yaml; do
            git show "$prev:$m" > "$RUNNER_TEMP/prev.yaml" 2>/dev/null || continue
            grep -q '^services:' "$RUNNER_TEMP/prev.yaml" || continue
            echo "== $m against $prev"
            "$RUNNER_TEMP/gate4ai" contract diff "$RUNNER_TEMP/prev.yaml" "$m"
          done
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...
  # Сквозные тесты: хост, relay и коннекторы из этого же коммита.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./scripts/ci.sh e2e
