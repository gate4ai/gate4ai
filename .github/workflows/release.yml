name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Трей под macOS: systray использует Cocoa через cgo, поэтому собирается на macOS.
  tray-darwin:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            d="gate4ai-tray_${GITHUB_REF_NAME#v}_darwin_${arch}"
            mkdir "$d"
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$d/gate4ai-tray" ./cmd/gate4ai-tray
            cp LICENSE NOTICE "$d/"
            tar czf "$d.tar.gz" "$d"
            shasum -a 256 "$d.tar.gz" >> tray-darwin-checksums.txt
          done
          cosign sign-blob --yes --output-signature=tray-darwin-checksums.txt.sig --output-certificate=tray-darwin-checksums.txt.pem tray-darwin-checksums.txt
          gh release upload "$GITHUB_REF_NAME" gate4ai-tray_*_darwin_*.tar.gz tray-darwin-checksums.txt*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
