# Релиз по тегу v*: один на всё — gate4ai и трей, gate4ai-relay. Сначала те же проверки,
# что в ci.yml; черновик релиза публикуется, только когда в нём есть всё, — до этого
# его не видят https://gate4.ai/latest и установщики. Потом relay выкатывается на сервер.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap и winget: без токенов goreleaser только готовит формулу и
          # манифест в dist/, публикация пропускается (skip_upload в .goreleaser.yaml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      # SLSA provenance каждого архива: gh attestation verify <архив> -R gate4ai/gate4ai.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
  # Трей под macOS: systray использует Cocoa через cgo, поэтому собирается на macOS.
  tray-darwin:
    needs: [release]
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - run: |
          set -euo pipefail
          mkdir out
          for arch in amd64 arm64; do
            d="gate4ai-tray_${GITHUB_REF_NAME#v}_darwin_${arch}"
            mkdir "$d"
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$d/gate4ai-tray" ./cmd/gate4ai-tray
            cp LICENSE "$d/"
            tar czf "out/$d.tar.gz" "$d"
          done
          cd out
          shasum -a 256 gate4ai-tray_*_darwin_*.tar.gz > tray-darwin-checksums.txt
          cosign sign-blob --yes --output-signature=tray-darwin-checksums.txt.sig --output-certificate=tray-darwin-checksums.txt.pem tray-darwin-checksums.txt
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" gate4ai-tray_*_darwin_*.tar.gz tray-darwin-checksums.txt*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Образ с Chrome для серверов без root: ghcr.io/gate4ai/gate4ai:<версия>, подпись cosign.
  docker:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  publish:
    needs: [tray-darwin, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # gate4ai-relay из релиза — на сервер relay.gate4.ai (vars.DEPLOY_HOST, secrets
  # DEPLOY_SSH_KEY и DEPLOY_KNOWN_HOSTS в окружении production; без них шаг пропускается).
  deploy-relay:
    needs: [publish]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download
        if: vars.DEPLOY_HOST != ''
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "gate4ai-relay_*_linux_amd64.tar.gz" -O relay.tar.gz
          mkdir dist && tar xzf relay.tar.gz -C dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload and install
        if: vars.DEPLOY_HOST != ''
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts=(-i "$HOME/.ssh/id_deploy" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # Каталог для загрузки — mktemp -d на сервере (0700, root), а не предсказуемый путь
          # в /tmp: другой локальный пользователь не подложит туда файл или симлинк.
          dir=$(ssh "${ssh_opts[@]}" "root@$HOST" 'mktemp -d')
          case $dir in /tmp/* | /var/tmp/*) ;; *) echo "mktemp -d on $HOST gave '$dir'" >&2; exit 1 ;; esac
          scp "${ssh_opts[@]}" dist/gate4ai-relay "root@$HOST:$dir/gate4ai-relay.new"
          # shellcheck disable=SC2029 # $dir раскрывается здесь: это путь на сервере
          ssh "${ssh_opts[@]}" "root@$HOST" "sh -s -- '$dir/gate4ai-relay.new'" < relay/deploy/remote-install.sh
      - name: Public check
        if: vars.DEPLOY_HOST != ''
        run: curl -fsS --max-time 10 https://relay.gate4.ai/api/health
