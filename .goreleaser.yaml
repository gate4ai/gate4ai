# Сборка и подпись релизов gate4ai: ядро, трей и relay (трей под macOS собирает
# отдельная задача release.yml на macOS-раннере — там нужен cgo; пакеты коннекторов —
# задача connectors).
version: 2
project_name: gate4ai
builds:
  - id: gate4ai
    main: ./cmd/gate4ai
    binary: gate4ai
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/gate4ai/gate4ai/internal/platform/version.Version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: gate4ai-tray
    main: ./cmd/gate4ai-tray
    binary: gate4ai-tray
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    overrides:
      - goos: windows
        goarch: amd64
        ldflags: ["-s -w -H windowsgui"]
      - goos: windows
        goarch: arm64
        ldflags: ["-s -w -H windowsgui"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: gate4ai-relay
    main: ./relay/cmd/gate4ai-relay
    binary: gate4ai-relay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
# Ядро и трей — отдельные архивы: трея под darwin здесь нет (его собирает
# release.yml на macOS), а в одном архиве число бинарников по ОС разное.
archives:
  - id: gate4ai
    ids: [gate4ai]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, docs/*]
  - id: gate4ai-tray
    ids: [gate4ai-tray]
    name_template: "gate4ai-tray_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE]
  - id: gate4ai-relay
    ids: [gate4ai-relay]
    name_template: "gate4ai-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, relay/README.md, relay/docs/*]
# Черновик: релиз публикует release.yml (publish), когда в нём есть трей под macOS
# и пакеты коннекторов, — до этого его не видят /latest и установщики.
release:
  draft: true
checksum:
  name_template: checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
# Каталоги. Формула и манифест готовятся всегда (dist/homebrew, dist/winget); в
# репозитории каталога они публикуются только при токене (secrets HOMEBREW_TAP_TOKEN,
# WINGET_TOKEN — docs/publishing.md, «Каталоги»).
homebrew_casks:
  - name: gate4ai
    ids: [gate4ai]
    repository:
      owner: gate4ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: https://gate4.ai
    description: "The guard between AI agents and your computer: policies, approvals and an audit log for the browser, files and sites"
    binaries: [gate4ai]
    caveats: |
      Start: gate4ai service install  (or: gate4ai ui)
      The browser of agents needs Google Chrome: gate4ai browser setup
winget:
  - name: gate4ai
    publisher: gate4ai
    publisher_url: https://gate4.ai
    publisher_support_url: https://github.com/gate4ai/gate4ai/issues
    package_identifier: gate4ai.gate4ai
    short_description: "The guard between AI agents and your computer"
    license: AGPL-3.0-only
    homepage: https://gate4.ai
    ids: [gate4ai]
    repository:
      owner: gate4ai
      name: winget-pkgs
      branch: "gate4ai-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: '{{ if .Env.WINGET_TOKEN }}false{{ else }}true{{ end }}'
