# Сборка и подпись релизов gate4ai: ядро и трей (трей под macOS собирает
# отдельная задача release.yml на macOS-раннере — там нужен cgo).
version: 2
project_name: gate4ai
builds:
  - id: gate4ai
    main: ./cmd/gate4ai
    binary: gate4ai
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/gate4ai/gate4ai/internal/platform/version.Version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: gate4ai-tray
    main: ./cmd/gate4ai-tray
    binary: gate4ai-tray
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    overrides:
      - goos: windows
        goarch: amd64
        ldflags: ["-s -w -H windowsgui"]
      - goos: windows
        goarch: arm64
        ldflags: ["-s -w -H windowsgui"]
    mod_timestamp: "{{ .CommitTimestamp }}"
# Ядро и трей — отдельные архивы: трея под darwin здесь нет (его собирает
# release.yml на macOS), а в одном архиве число бинарников по ОС разное.
archives:
  - id: gate4ai
    ids: [gate4ai]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, docs/*]
  - id: gate4ai-tray
    ids: [gate4ai-tray]
    name_template: "gate4ai-tray_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE]
checksum:
  name_template: checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
