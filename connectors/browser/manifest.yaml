connector: browser
description: Pages in the user's dedicated Chrome profile; browser sessions for agents and page actions for other connectors
version: "0.7.6"
runtime: native
platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
contract: 1
services: [open, observe, act, page_extract, page_screenshot, login, fill_secret]
capabilities:
  reveal: ["${setting:model_key}"]
limits: { timeout_s: 600 } # handoff ждёт человека до 9 минут
actions:
  - name: read
    class: read
    untrusted: true
    description: "Open a page on an allowed site and return its text; a page that is not HTML (a JSON API, text) — its body as the server sent it (body, content_type). Works in a temporary tab of the same browser profile (its cookies) that closes afterwards: an open browser session is not touched, so it works while one is open."
    input_schema:
      type: object
      properties:
        url: { type: string, format: url }
      required: [url]
    output_schema:
      type: object
      properties:
        url: { type: string }
        title: { type: string }
        truncated: { type: boolean }
        content_type: { type: string, description: "a page that is not HTML: its type" }
        body: { type: string, description: "a page that is not HTML (JSON, text): the body as the server sent it, up to the limit (tokens and the owner's redact_params hidden)" }
        size: { type: integer, description: "a page that is not HTML: bytes in the body" }
      required: [url, title]
    example: gate4ai browser read --url https://app.example.org/
  - name: screenshot
    class: read
    evidence: png
    description: "Screenshot of one element (CSS selector); the image is returned and stored as evidence. Works in a temporary tab of the same browser profile (its cookies) that closes afterwards: an open browser session is not touched, so it works while one is open."
    input_schema:
      type: object
      properties:
        url: { type: string, format: url }
        selector: { type: string, description: CSS selector }
      required: [url, selector]
    output_schema:
      type: object
      properties:
        url: { type: string }
        selector: { type: string }
      required: [url, selector]
  - name: extract
    class: read
    untrusted: true
    description: "Extract data from a page by instruction (uses the model configured by the user). Works in a temporary tab of the same browser profile (its cookies) that closes afterwards: an open browser session is not touched, so it works while one is open."
    input_schema:
      type: object
      properties:
        url: { type: string, format: url }
        instruction: { type: string }
      required: [url, instruction]
  # Действия со страницей: агенту — в сеансе (open без session начинает его,
  # close заканчивает и отдаёт записанные шаги; сайты — из настроек), другим
  # коннекторам через service_call — страница одна на корневое действие агента,
  # сайты — params.sites вызывающего ({mode, domains, blocked}).
  - name: open
    class: read
    description: "Open a page. Agent: without session starts a browser session (the page stays open between calls until browser.close) and returns its id; with session navigates in it. Connectors: the page of the root call"
    input_schema:
      type: object
      properties:
        url: { type: string, format: url }
        session: { type: string, description: "agents: the session from a previous browser.open" }
        wait_for_selector: { type: string, description: "wait until a visible element matches (SPA content loads after the page)" }
        wait_for_text: { type: string, description: "wait until a visible element (of wait_for_selector, or any) contains this text" }
        wait_for_url: { type: string, description: "wait until the address matches: with * — the whole address by the pattern (https://app.example.org/alerting/*), without — the address contains it" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait (0 — 10 s, up to 60 s). On timeout the error shows the page state: url, title, ready_state, pending_requests, the start of its text; leaving for a sign-in page ends the wait at once with code redirected" }
      required: [url]
    output_schema:
      type: object
      properties:
        url: { type: string, description: address after redirects }
        title: { type: string }
        session: { type: string, description: "agents: pass it to the next page actions and to browser.close" }
        still_loading: { type: boolean, description: "the page was still loading after 5 s (requests in flight): wait for its content with observe --wait_for_text / --wait_for_selector" }
        login_required:
          type: object
          description: "the page is at the sign-in site of an account available to you: call browser.login with it"
          properties: { account: { type: string } }
          required: [account]
      required: [url, title]
    example: gate4ai browser open --url https://app.example.org/
  - name: observe
    class: read
    untrusted: true
    description: "Address, title and text of the open page (or of one element: selector); a page that is not HTML (JSON API, text) — its body as the server sent it (body, content_type), without Chrome's viewer; elements: true adds the interactive elements with CSS selectors for act and the values of fields (not passwords), kinds narrows them (fields, buttons, links); outline: true — the page structure (containers with id, role, data-testid)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        max_chars: { type: integer, minimum: 0, description: "0 — the browser's limit" }
        selector: { type: string, description: "only inside this element: a dialog, a card, a list" }
        elements: { type: boolean, description: "add visible fields, buttons and links with a unique CSS selector each (up to 300; ads and trackers are skipped); fields show the start of their value (200 characters) and value_length" }
        kinds: { type: array, items: { type: string, enum: [fields, buttons, links] }, description: "only these kinds of elements (implies elements), e.g. fields,buttons" }
        outline: { type: boolean, description: "add the structure: visible containers with a selector (dialogs, lists, sections), up to 300" }
        wait_for_selector: { type: string, description: "wait until a visible element matches (SPA content loads after the page)" }
        wait_for_text: { type: string, description: "wait until a visible element (of wait_for_selector, or any) contains this text" }
        wait_for_url: { type: string, description: "wait until the address matches: with * — the whole address by the pattern (https://app.example.org/alerting/*), without — the address contains it" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait (0 — 10 s, up to 60 s). On timeout the error shows the page state: url, title, ready_state, pending_requests, the start of its text; leaving for a sign-in page ends the wait at once with code redirected" }
    output_schema:
      type: object
      properties:
        url: { type: string }
        title: { type: string }
        text: { type: string }
        truncated: { type: boolean }
        content_type: { type: string, description: "a page that is not HTML: its type" }
        body: { type: string, description: "a page that is not HTML (JSON, text): the body as the server sent it, up to max_chars (tokens and the owner's redact_params hidden)" }
        size: { type: integer, description: "a page that is not HTML: bytes in the body" }
        elements:
          type: array
          items:
            type: object
            properties:
              selector: { type: string, description: "CSS selector for act (by data-testid, name, placeholder, aria-label or id when possible)" }
              kind: { type: string, enum: [field, button, link] }
              tag: { type: string }
              type: { type: string }
              role: { type: string }
              text: { type: string, description: "visible text, label, placeholder or aria-label" }
              href: { type: string }
              disabled: { type: boolean }
              value: { type: string, description: "fields: the start of the value (200 characters); never of a password" }
              value_length: { type: integer, description: "fields: the length of the value in characters" }
              checked: { type: boolean, description: "checkboxes, radio buttons, switches" }
            required: [selector, kind, tag]
        outline:
          type: array
          items:
            type: object
            properties:
              depth: { type: integer }
              selector: { type: string, description: "unique selector, empty when the container has none" }
              tag: { type: string }
              role: { type: string }
              text: { type: string, description: "the start of its visible text (200 characters)" }
              truncated: { type: boolean, description: "the text is longer: read it with observe --selector" }
              children: { type: integer }
            required: [depth, selector, tag, children]
        login_required:
          type: object
          description: "the page is at the sign-in site of an account available to you: call browser.login with it"
          properties: { account: { type: string } }
          required: [account]
      required: [url, title]
  - name: act
    class: write
    description: "Act on the open page by CSS selector (and visible text): click; fill — replace the value of a field (input, textarea, rich editor), append — add to its end, paste — replace it as pasted from the clipboard (editors parse Markdown or HTML); press — a key or a combination; wait — for an element. fill / append / paste return the value that ended up in the field (length, start, end). value: up to 262144 characters (256 KB); a long text from a file: --value_file <path>"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        selector: { type: string, description: CSS selector }
        method: { type: string, enum: [click, fill, append, paste, press, wait] }
        text: { type: string, description: "the first visible element whose text, label, placeholder or aria-label contains it" }
        value: { type: string, maxLength: 262144, description: "fill / append / paste: the text, up to 262144 characters (CLI: --value_file <path> reads it from a file; leading and trailing spaces are trimmed); press: Enter, Tab, Escape, Backspace, Delete, Space, Home, End, PageUp, PageDown, ArrowUp, ArrowDown, ArrowLeft, ArrowRight, a–z, 0–9 with modifiers Ctrl, Shift, Alt, Meta joined by + (Ctrl+A selects all, Ctrl+Z undoes, Ctrl+Enter, Shift+Tab). The system clipboard is not used: Ctrl+C / Ctrl+X / Ctrl+V are refused — paste a text with method paste" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait for the element (0 — 10 s)" }
        expect_selector: { type: string, description: "the action must make a visible element match it (a dialog, the next list), else not_found: no effect" }
        expect_text: { type: string, description: "the action must make visible text appear (in expect_selector, or anywhere)" }
        expect_url_change: { type: boolean, description: "the action must change the page address" }
        expect_timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait for the effect (0 — 5 s)" }
      required: [selector, method]
    output_schema:
      type: object
      properties:
        url: { type: string, description: address after the action }
        text: { type: string, description: text of the element (up to 2000 characters) }
        value:
          type: object
          description: "fill / append / paste: what ended up in the field; hidden for a password or after a secret was entered on the page"
          properties:
            length: { type: integer, description: characters }
            start: { type: string, description: "the first 1000 characters" }
            end: { type: string, description: "the last 200 characters, when longer" }
            hidden: { type: boolean }
          required: [length, start]
      required: [url]
    example: gate4ai browser act --session s-… --selector textarea[name=text] --method fill --value_file article.md
  - name: reload
    class: read
    description: "Reload the open page (the address is checked again, as in open)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        wait_for_selector: { type: string, description: "wait until a visible element matches" }
        wait_for_text: { type: string, description: "wait until a visible element (of wait_for_selector, or any) contains this text" }
        wait_for_url: { type: string, description: "wait until the address matches: with * — the whole address by the pattern (https://app.example.org/alerting/*), without — the address contains it" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait (0 — 10 s, up to 60 s). On timeout the error shows the page state: url, title, ready_state, pending_requests, the start of its text; leaving for a sign-in page ends the wait at once with code redirected" }
      required: [session]
    output_schema:
      type: object
      properties:
        url: { type: string }
        title: { type: string }
      required: [url, title]
  - name: handoff
    class: read
    description: "Hand the open page over to the user and wait: the user is notified (Web UI, desktop, Telegram) with your message and does the step in the gate4ai Chrome window — signs in on a site without an account in gate4ai, solves a captcha, confirms by SMS. Ends when the address changes (default) or until_selector appears; status done or timeout. Never ask the user for passwords in chat"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        message: { type: string, maxLength: 200, description: "what the user should do, e.g. Sign in to habr.com" }
        until_url_change: { type: boolean, description: "done when the page address changes (the default)" }
        until_selector: { type: string, description: "done when a visible element matches (with until_url_change: both)" }
        timeout_ms: { type: integer, minimum: 0, maximum: 540000, description: "how long to wait (0 — 5 minutes, up to 9)" }
      required: [session, message]
    output_schema:
      type: object
      properties:
        url: { type: string, description: address when the wait ended }
        status: { type: string, enum: [done, timeout] }
      required: [url, status]
    example: gate4ai browser handoff --session s-… --message "Sign in to habr.com" --until_selector .user-menu
  - name: network
    class: read
    untrusted: true
    description: "Requests the open page made to the allowed sites (fetch / XHR): method, address, status and the start of JSON or text responses — to find the site's API. Tokens, passwords, sign-in responses and the owner's redact_params are hidden"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        url_contains: { type: string, description: "only requests whose address contains it" }
        all_sites: { type: boolean, description: "also requests to other sites (analytics, CDN)" }
      required: [session]
    output_schema:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              url: { type: string }
              status: { type: integer }
              kind: { type: string, description: fetch or xhr }
              mime: { type: string }
              body: { type: string, description: "the start of the response (2000 characters)" }
              truncated: { type: boolean }
            required: [url, kind]
        hint: { type: string, description: "the addresses contain identifiers that may be personal data: ask the owner to hide them (redact_params)" }
        login_required:
          type: object
          description: "the page is at the sign-in site of an account available to you: call browser.login with it"
          properties: { account: { type: string } }
          required: [account]
      required: [requests]
  # Запросы со страницы сеанса (fetch с её cookies и origin): метод — имя
  # действия, чтобы класс и правила политики различали чтение и изменения.
  - name: get
    class: read
    untrusted: true
    description: "An HTTP GET from the open page of the session (with the user's cookies): an API of the site, e.g. the one browser.network found. The address is checked by the site list; the response — status, url, headers (without cookies and authorization), json (parsed) or body with content_type, size in bytes, truncated; a request with effect is not redirected (redirect: true)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        max_chars: { type: integer, minimum: 0, description: "the start of the response body to return (0 — the browser's limit)" }
      required: [session, url]
  - name: head
    class: read
    untrusted: true
    description: "An HTTP HEAD from the open page of the session: status, url and headers"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        max_chars: { type: integer, minimum: 0, description: "the start of the response body to return (0 — the browser's limit)" }
      required: [session, url]
  - name: post
    class: write
    untrusted: true
    description: "An HTTP POST from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        body: { type: string, maxLength: 262144, description: "the request body (a JSON body gets Content-Type: application/json unless headers set it; CLI: --body_file <path>)" }
        max_chars: { type: integer, minimum: 0, description: "the start of the response body to return (0 — the browser's limit)" }
      required: [session, url]
  - name: put
    class: write
    untrusted: true
    description: "An HTTP PUT from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        body: { type: string, maxLength: 262144, description: "the request body (a JSON body gets Content-Type: application/json unless headers set it; CLI: --body_file <path>)" }
        max_chars: { type: integer, minimum: 0, description: "the start of the response body to return (0 — the browser's limit)" }
      required: [session, url]
  - name: patch
    class: write
    untrusted: true
    description: "An HTTP PATCH from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        body: { type: string, maxLength: 262144, description: "the request body (a JSON body gets Content-Type: application/json unless headers set it; CLI: --body_file <path>)" }
        max_chars: { type: integer, minimum: 0, description: "the start of the response body to return (0 — the browser's limit)" }
      required: [session, url]
  - name: delete
    class: write
    untrusted: true
    description: "An HTTP DELETE from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        max_chars: { type: integer, minimum: 0, description: "the start of the response body to return (0 — the browser's limit)" }
      required: [session, url]
  # Вход по учётке владельца (credentials в конфигурации gate4ai): значения
  # секретов хост передаёт пакету только для этих двух действий, агенту и
  # коннектору они не видны. После ввода секрета страницу нельзя читать
  # (secret_on_page) до перехода верхнего документа.
  - name: login
    class: write
    description: "Sign in on the open sign-in page with an account the owner configured in gate4ai (credentials): its fields (constants and secrets from the vault) are entered and the form is submitted; the values are never shown. Status: logged_in, submitted or still_on_login (captcha, SMS code or a wrong password: tell the user to finish in the gate4ai Chrome window)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        account: { type: string, description: "the account alias (@name); connectors: also the slot from their credentials" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait for leaving the sign-in page (0 — 15 s)" }
      required: [account]
    output_schema:
      type: object
      properties:
        url: { type: string, description: address after sign-in }
        status: { type: string, enum: [logged_in, submitted, still_on_login] }
        origin: { type: string, description: origin of the page the account was entered on }
      required: [status]
    example: gate4ai browser login --session s-… --account @example
  - name: fill_secret
    class: write
    description: "Enter one field of an account into a field of the open sign-in page without submitting (for multi-step sign-in); source: human asks the user for a code and types the answer in — it is not returned"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        account: { type: string, description: "the account alias (@name); connectors: also the slot from their credentials" }
        field: { type: string, description: "the account field: its name or secret alias (password, @example.password)" }
        selector: { type: string, description: "CSS selector of the page field: for the account's sign-in connector (via), or a password field when the owner set no selector; otherwise the owner's selector is used" }
        source: { type: string, enum: [account, human], description: "account (default) — the account field; human — a code the user types in" }
        prompt: { type: string, maxLength: 200, description: "source: human — the question for the user (the owner's question in the account wins)" }
      required: [account]
    output_schema:
      type: object
      properties:
        url: { type: string }
        origin: { type: string }
      required: [url]
  - name: page_extract
    class: read
    untrusted: true
    description: Extract data from the open page by instruction (uses the model configured by the user)
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        instruction: { type: string }
      required: [instruction]
  - name: page_screenshot
    class: read
    description: Screenshot of one element of the open page (PNG in content)
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        selector: { type: string, description: CSS selector }
      required: [selector]
  - name: close
    class: read
    untrusted: true
    description: "End the browser session and free the page. Returns {session, closed: true, steps: <number of recorded steps>}; steps: true adds step_list (action, args, status: ok or the error code — without results and page texts); save_steps: true writes the full record ({session, steps} with results) to a file and returns its path in steps_file — a test fixture for a connector (hosttest.LoadFixture, hosttest.Replay). all: true closes every session of yours — this agent in this agent session (a lost id, a stuck session); others' sessions stay open: {closed: true, sessions: N}"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        all: { type: boolean, description: "close all your sessions instead" }
        steps: { type: boolean, description: "list the steps: action, args (long values cut), status ok or the error code" }
        save_steps: { type: boolean, description: "write the full record ({session, steps} with results) to a file in the gate4ai data folder; its path is steps_file" }
