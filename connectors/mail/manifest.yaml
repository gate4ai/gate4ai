connector: email
description: Email over IMAP/SMTP
version: "0.7.8"
runtime: wasm
capabilities:
  network:
    - { host: "${setting:imap.host}", port: "${setting:imap.port}", scheme: tls }
    - { host: "${setting:smtp.host}", port: "${setting:smtp.port}", scheme: tls }
    # tls: none хост разрешает только для localhost (локальные мосты, тесты)
    - { host: "${setting:imap.host}", port: "${setting:imap.port}", scheme: tcp }
    - { host: "${setting:smtp.host}", port: "${setting:smtp.port}", scheme: tcp }
  secrets:
    - { alias: "${setting:imap.password}", bind: ["${setting:imap.host}"] }
    - { alias: "${setting:smtp.password}", bind: ["${setting:smtp.host}"] }
    # без smtp.password для SMTP используется пароль IMAP
    - { alias: "${setting:imap.password}", bind: ["${setting:smtp.host}"] }
limits: { memory_mb: 128, timeout_s: 60 }
actions:
  - name: list
    class: read
    untrusted: true
    description: List messages in a folder (newest first)
    input_schema:
      type: object
      properties:
        folder: { type: string, default: INBOX }
        limit: { type: integer, default: 20, minimum: 1, maximum: 100 }
        unseen_only: { type: boolean }
        query: { type: string, description: full-text search }
    example: gate4ai email list --limit 10
  - name: read
    class: read
    untrusted: true
    description: Read one message (does not mark it as read)
    input_schema:
      type: object
      properties:
        folder: { type: string, default: INBOX }
        uid: { type: integer }
      required: [uid]
    example: gate4ai email read --uid 42
  - name: draft
    class: write
    verify: drafts_folder
    evidence: eml
    description: Save a draft (not sent)
    input_schema: &addr
      type: object
      properties:
        to: { type: array, items: { type: string, format: email }, description: recipients }
        cc: { type: array, items: { type: string, format: email }, description: copy recipients }
        subject: { type: string }
        body: { type: string, description: plain text body }
        in_reply_to: { type: string, maxLength: 998, description: "Message-ID of the message being answered, as list/read return it: <id@host>" }
      required: [to, subject]
    output_schema:
      type: object
      properties:
        message_id: { type: string }
        folder: { type: string }
        status: { type: string }
      required: [message_id, folder, status]
  - name: send
    class: external
    verify: sent_folder
    evidence: eml
    description: Send an email
    input_schema: *addr
    output_schema:
      type: object
      properties:
        message_id: { type: string }
        recipients: { type: array, items: { type: string } }
        smtp_response: { type: string }
        client_copy_error: { type: string, description: "sent_copy: client — why the copy was not saved to Sent" }
      required: [message_id, recipients, smtp_response]
