connector: probe
version: "1"
runtime: wasm
capabilities:
  storage: { quota_mb: 1 }
limits: { memory_mb: 48, timeout_s: 3 }
actions:
  - { name: deny_all, class: read }
  - { name: settings, class: read }
  - { name: kv, class: write }
  - { name: spin, class: read }
  - { name: sleep, class: read }
  - { name: hog, class: read }
  - { name: crash, class: read }
