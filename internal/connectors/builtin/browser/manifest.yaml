connector: browser
description: Pages in the user's dedicated Chrome profile; browser sessions for agents and page actions for other connectors
version: "0.7.9"
runtime: builtin
contract: 2
services: [open, observe, act, dialog, download, page_screenshot, login, fill_secret]
limits: { timeout_s: 600 } # handoff ждёт человека до 9 минут
actions:
  - name: read
    class: read
    untrusted: true
    description: "Open a page on an allowed site and return its text; a page that is not HTML (a JSON API, text) — its body as the server sent it (body, content_type). Works in a temporary tab of the same browser profile (its cookies) that closes afterwards: an open browser session is not touched, so it works while one is open."
    input_schema:
      type: object
      properties:
        url: { type: string, format: url }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "characters of the page text or of a non-HTML body, up to 1000000 (0 — the default: the browser's max_text_chars, 30000 by default; a JSON body — 200000); a truncated body comes with hint: its full length and the max_chars to pass" }
      required: [url]
    output_schema:
      type: object
      properties:
        url: { type: string }
        title: { type: string }
        truncated: { type: boolean }
        content_type: { type: string, description: "a page that is not HTML: its type" }
        body: { type: string, description: "a page that is not HTML (JSON, text): the body as the server sent it, up to the limit (tokens and the owner's redact_params hidden)" }
        size: { type: integer, description: "a page that is not HTML: bytes in the body" }
        hint: { type: string, description: "a truncated body: its full length in characters and the max_chars that returns it whole" }
      required: [url, title]
    example: gate4ai browser read --url https://app.example.org/
  - name: screenshot
    class: read
    evidence: png
    description: "Screenshot of one element (CSS selector); the image is returned and stored as evidence. Works in a temporary tab of the same browser profile (its cookies) that closes afterwards: an open browser session is not touched, so it works while one is open."
    input_schema:
      type: object
      properties:
        url: { type: string, format: url }
        selector: { type: string, description: CSS selector }
      required: [url, selector]
    output_schema:
      type: object
      properties:
        url: { type: string }
        selector: { type: string }
      required: [url, selector]
  # Действия со страницей: агенту — в сеансе (open без session начинает его,
  # close заканчивает и отдаёт записанные шаги; сайты — из настроек), другим
  # коннекторам через service_call — страница одна на корневое действие агента,
  # сайты — params.sites вызывающего ({mode, domains, blocked}).
  - name: open
    class: read
    description: "Open a page. Agent: without session starts a browser session in a window of its own (the page stays open between calls until browser.close; other agents' sessions are in other windows) and returns its id and view_url — a link where the user watches the session live and can take control (it opens only after the user signs in to gate4ai: give it to the user when they may want to see the work); with session navigates in it. While the user holds the session, its actions answer session_held_by_user: wait, do not go around them. A page that asks before leaving (unsaved changes) is left: you asked to go. When the browser is full (sessions of other agents), busy says whose sessions they are, since when and when they close; wait_for_browser waits in the queue. Connectors: the page of the root call"
    input_schema:
      type: object
      properties:
        url: { type: string, format: url }
        session: { type: string, description: "agents: the session from a previous browser.open" }
        wait_for_browser: { type: string, description: "agents, a new session: how long to wait for a free place in the browser when it is busy with other sessions, e.g. 10m (up to 9m; default 5s, then busy)" }
        wait_for_selector: { type: string, description: "wait until a visible element matches (SPA content loads after the page)" }
        wait_for_text: { type: string, description: "wait until a visible element (of wait_for_selector, or any) contains this text" }
        wait_for_url: { type: string, description: "wait until the address matches: with * — the whole address by the pattern (https://app.example.org/alerting/*), without — the address contains it" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long the whole action may take, navigation included (0 — 10 s of waiting, 45 s in all; up to 60 s). On timeout the error (code timeout) shows the page state: url, title, ready_state, pending_requests, the start of its text, or the dialog open on it; leaving for a sign-in page ends the wait at once with code redirected" }
      required: [url]
    output_schema:
      type: object
      properties:
        url: { type: string, description: address after redirects }
        title: { type: string }
        session: { type: string, description: "agents: pass it to the next page actions and to browser.close" }
        view_url: { type: string, description: "agents, a new session: the link where the user watches it live and can take control (after signing in to gate4ai)" }
        still_loading: { type: boolean, description: "the page was still loading after 5 s (requests in flight): wait for its content with observe --wait_for_text / --wait_for_selector" }
        login_required:
          type: object
          description: "the page is at the sign-in site of an account available to you: call browser.login with it"
          properties: { account: { type: string } }
          required: [account]
      required: [url, title]
    example: gate4ai browser open --url https://app.example.org/
  - name: observe
    class: read
    untrusted: true
    description: "Address, title and text of the open page (or of one element: selector); a page that is not HTML (JSON API, text) — its body as the server sent it (body, content_type), without Chrome's viewer; elements: true adds the interactive elements with CSS selectors for act and the values of fields (not passwords), kinds narrows them (fields, buttons, links); outline: true — the page structure (containers with id, role, data-testid)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "characters of the page text or of a non-HTML body, up to 1000000 (0 — the default: the browser's max_text_chars, 30000 by default; a JSON body — 200000); a truncated body comes with hint: its full length and the max_chars to pass" }
        selector: { type: string, description: "only inside this element: a dialog, a card, a list" }
        elements: { type: boolean, description: "add visible fields, buttons and links with a unique CSS selector each (up to 300; ads and trackers are skipped); fields show the start of their value (200 characters) and value_length" }
        kinds: { type: array, items: { type: string, enum: [fields, buttons, links] }, description: "only these kinds of elements (implies elements), e.g. fields,buttons" }
        outline: { type: boolean, description: "add the structure: visible containers with a selector (dialogs, lists, sections), up to 300" }
        wait_for_selector: { type: string, description: "wait until a visible element matches (SPA content loads after the page)" }
        wait_for_text: { type: string, description: "wait until a visible element (of wait_for_selector, or any) contains this text" }
        wait_for_url: { type: string, description: "wait until the address matches: with * — the whole address by the pattern (https://app.example.org/alerting/*), without — the address contains it" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long the whole action may take, navigation included (0 — 10 s of waiting, 45 s in all; up to 60 s). On timeout the error (code timeout) shows the page state: url, title, ready_state, pending_requests, the start of its text, or the dialog open on it; leaving for a sign-in page ends the wait at once with code redirected" }
    output_schema:
      type: object
      properties:
        url: { type: string }
        title: { type: string }
        text: { type: string }
        truncated: { type: boolean }
        content_type: { type: string, description: "a page that is not HTML: its type" }
        body: { type: string, description: "a page that is not HTML (JSON, text): the body as the server sent it, up to max_chars (tokens and the owner's redact_params hidden)" }
        size: { type: integer, description: "a page that is not HTML: bytes in the body" }
        hint: { type: string, description: "a truncated body: its full length in characters and the max_chars that returns it whole" }
        elements:
          type: array
          items:
            type: object
            properties:
              selector: { type: string, description: "CSS selector for act (by data-testid, name, placeholder, aria-label or id when possible)" }
              kind: { type: string, enum: [field, button, link] }
              tag: { type: string }
              type: { type: string }
              role: { type: string }
              text: { type: string, description: "visible text, label, placeholder or aria-label" }
              href: { type: string }
              disabled: { type: boolean }
              value: { type: string, description: "fields: the start of the value (200 characters); never of a password" }
              value_length: { type: integer, description: "fields: the length of the value in characters" }
              checked: { type: boolean, description: "checkboxes, radio buttons, switches" }
              icon: { type: boolean, description: "an icon without text inside an interactive element (the cross that removes a selected value); text is its aria-label, title or the text next to it" }
            required: [selector, kind, tag]
        outline:
          type: array
          items:
            type: object
            properties:
              depth: { type: integer }
              selector: { type: string, description: "unique selector, empty when the container has none" }
              tag: { type: string }
              role: { type: string }
              text: { type: string, description: "the start of its visible text (200 characters)" }
              truncated: { type: boolean, description: "the text is longer: read it with observe --selector" }
              children: { type: integer }
            required: [depth, selector, tag, children]
        login_required:
          type: object
          description: "the page is at the sign-in site of an account available to you: call browser.login with it"
          properties: { account: { type: string } }
          required: [account]
      required: [url, title]
  - name: act
    class: write
    description: "Act on the open page by CSS selector (and visible text): click; fill — replace the value of a field (input, textarea, rich editor), append — add to its end, paste — replace it as pasted from the clipboard (editors parse Markdown or HTML); type — type the text key by key (real keydown / keypress / input / keyup for each character: tag fields that make a tag on a comma or Enter, search in dropdowns), then submit (a key) if given; press — a key, any single character (\",\", \";\") or a combination; wait — for an element. fill / append / paste / type / press return the value that ended up in the focused field (length, start, end); type / press also return changes: elements that appeared or disappeared next to the field (a new tag, the options of a list), lists, menus and dialogs that opened or closed. screenshot: true adds a screenshot of the window (file in the answer); a failed expect_* answers not_found with the path of a screenshot. value: up to 262144 characters (256 KB), type — up to 4096; a long text from a file: --value_file <path>"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        selector: { type: string, description: CSS selector }
        method: { type: string, enum: [click, fill, append, paste, type, press, wait] }
        text: { type: string, description: "the first visible element whose text, label, placeholder or aria-label contains it" }
        value: { type: string, maxLength: 262144, description: "fill / append / paste: the text, up to 262144 characters (CLI: --value_file <path> reads it from a file; leading and trailing spaces are trimmed); type: the text, up to 4096 characters, typed as is (commas and spaces are keys too, the text is not split); press: Enter, Tab, Escape, Backspace, Delete, Space, Home, End, PageUp, PageDown, ArrowUp, ArrowDown, ArrowLeft, ArrowRight or any single character (a, 7, \",\", \";\", ж) with modifiers Ctrl, Shift, Alt, Meta joined by + (Ctrl+A selects all, Ctrl+Z undoes, Ctrl+Enter, Shift+Tab). The system clipboard is not used: Ctrl+C / Ctrl+X / Ctrl+V are refused — paste a text with method paste" }
        delay_ms: { type: integer, minimum: 0, maximum: 1000, description: "type: pause between characters (0 — none; for pages that drop fast input)" }
        submit: { type: string, description: "type: a key or a combination to press after the text, as in press (Enter, Tab, \",\")" }
        screenshot: { type: boolean, description: "agents: add a screenshot of the window after the action (screenshot.file in the answer)" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait for the element (0 — 10 s)" }
        expect_selector: { type: string, description: "the action must make a visible element match it (a dialog, the next list), else not_found: no effect" }
        expect_text: { type: string, description: "the action must make visible text appear (in expect_selector, or anywhere)" }
        expect_url_change: { type: boolean, description: "the action must change the page address" }
        expect_timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait for the effect (0 — 5 s)" }
      required: [selector, method]
    output_schema:
      type: object
      properties:
        url: { type: string, description: address after the action }
        text: { type: string, description: text of the element (up to 2000 characters) }
        value:
          type: object
          description: "fill / append / paste / type / press: what ended up in the focused field; hidden for a password or after a secret was entered on the page"
          properties:
            length: { type: integer, description: characters }
            start: { type: string, description: "the first 1000 characters" }
            end: { type: string, description: "the last 200 characters, when longer" }
            hidden: { type: boolean }
          required: [length, start]
        changes:
          type: object
          description: "type / press: what changed on the page — each list has elements {tag, role, text} (up to 10; more — how many were left out); none when nothing changed"
          properties:
            added: { type: array, description: "elements that appeared (a tag, a hint, the selected value)", items: { type: object, properties: { tag: { type: string }, role: { type: string }, text: { type: string } } } }
            removed: { type: array, description: "elements that disappeared", items: { type: object, properties: { tag: { type: string }, role: { type: string }, text: { type: string } } } }
            opened: { type: array, description: "lists, menus, dialogs that opened (role listbox, menu, dialog) with their text", items: { type: object, properties: { tag: { type: string }, role: { type: string }, text: { type: string } } } }
            closed: { type: array, description: "lists, menus, dialogs that closed", items: { type: object, properties: { tag: { type: string }, role: { type: string }, text: { type: string } } } }
            expanded: { type: array, description: "elements whose aria-expanded became true (a combobox opened)", items: { type: object, properties: { tag: { type: string }, role: { type: string }, text: { type: string } } } }
            collapsed: { type: array, description: "elements whose aria-expanded became false", items: { type: object, properties: { tag: { type: string }, role: { type: string }, text: { type: string } } } }
            more: { type: integer }
        screenshot:
          type: object
          description: "screenshot: true — the screenshot of the window"
          properties:
            file: { type: string, description: "the PNG file in the gate4ai data folder (browser-shots)" }
            mode: { type: string }
            width: { type: integer }
            height: { type: integer }
            bytes: { type: integer }
      required: [url]
    example: gate4ai browser act --session s-… --selector textarea[name=text] --method fill --value_file article.md
  - name: reload
    class: read
    description: "Reload the open page (the address is checked again, as in open); a page that asks before leaving (unsaved changes) is reloaded: you asked for it"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        wait_for_selector: { type: string, description: "wait until a visible element matches" }
        wait_for_text: { type: string, description: "wait until a visible element (of wait_for_selector, or any) contains this text" }
        wait_for_url: { type: string, description: "wait until the address matches: with * — the whole address by the pattern (https://app.example.org/alerting/*), without — the address contains it" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long the whole action may take, navigation included (0 — 10 s of waiting, 45 s in all; up to 60 s). On timeout the error (code timeout) shows the page state: url, title, ready_state, pending_requests, the start of its text, or the dialog open on it; leaving for a sign-in page ends the wait at once with code redirected" }
      required: [session]
    output_schema:
      type: object
      properties:
        url: { type: string }
        title: { type: string }
      required: [url, title]
  - name: handoff
    class: read
    description: "Hand the open page over to the user and wait: the user is notified (Web UI, desktop, Telegram, push) with your message and the session link (its view_url), opens it on any device and does the step — signs in on a site without an account in gate4ai, solves a captcha, confirms by SMS. Send the user the view_url in your own chat too if they may miss the gate4ai notification. Ends when the address changes (default) or until_selector appears; status done or timeout. Never ask the user for passwords in chat"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        message: { type: string, maxLength: 200, description: "what the user should do, e.g. Sign in to habr.com" }
        until_url_change: { type: boolean, description: "done when the page address changes (the default)" }
        until_selector: { type: string, description: "done when a visible element matches (with until_url_change: both)" }
        timeout_ms: { type: integer, minimum: 0, maximum: 540000, description: "how long to wait (0 — 5 minutes, up to 9)" }
      required: [session, message]
    output_schema:
      type: object
      properties:
        url: { type: string, description: address when the wait ended }
        status: { type: string, enum: [done, timeout, declined], description: "done — the page changed (or the user pressed Done), timeout — the user did not finish in time, declined — the user said they will not do it" }
      required: [url, status]
    example: gate4ai browser handoff --session s-… --message "Sign in to habr.com" --until_selector .user-menu
  - name: network
    class: read
    untrusted: true
    description: "Requests the open page made to the allowed sites (fetch / XHR): method, address, status and the start of JSON or text responses — to find the site's API. Tokens, passwords, sign-in responses and the owner's redact_params are hidden"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        url_contains: { type: string, description: "only requests whose address contains it" }
        all_sites: { type: boolean, description: "also requests to other sites (analytics, CDN)" }
      required: [session]
    output_schema:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              url: { type: string }
              status: { type: integer }
              kind: { type: string, description: fetch or xhr }
              mime: { type: string }
              body: { type: string, description: "the start of the response (2000 characters)" }
              truncated: { type: boolean }
            required: [url, kind]
        hint: { type: string, description: "the addresses contain identifiers that may be personal data: ask the owner to hide them (redact_params)" }
        login_required:
          type: object
          description: "the page is at the sign-in site of an account available to you: call browser.login with it"
          properties: { account: { type: string } }
          required: [account]
      required: [requests]
  # Запросы со страницы сеанса (fetch с её cookies и origin): метод — имя
  # действия, чтобы класс и правила политики различали чтение и изменения.
  - name: get
    class: read
    untrusted: true
    description: "An HTTP GET from the open page of the session (with the user's cookies): an API of the site, e.g. the one browser.network found. The address is checked by the site list; the response — status, url, headers (without cookies and authorization), json (parsed) or body with content_type, size in bytes, truncated; a request with effect is not redirected (redirect: true)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "the start of the response body to return, up to 1000000 characters (0 — the default: 200000 for JSON, for other text the browser's max_text_chars, 30000 by default); a truncated body comes with truncated: true and hint: its full length and the max_chars to pass (a truncated JSON is not parsed)" }
      required: [session, url]
  - name: head
    class: read
    untrusted: true
    description: "An HTTP HEAD from the open page of the session: status, url and headers"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "the start of the response body to return, up to 1000000 characters (0 — the default: 200000 for JSON, for other text the browser's max_text_chars, 30000 by default); a truncated body comes with truncated: true and hint: its full length and the max_chars to pass (a truncated JSON is not parsed)" }
      required: [session, url]
  - name: post
    class: write
    untrusted: true
    description: "An HTTP POST from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        body: { type: string, maxLength: 262144, description: "the request body (a JSON body gets Content-Type: application/json unless headers set it; CLI: --body_file <path>)" }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "the start of the response body to return, up to 1000000 characters (0 — the default: 200000 for JSON, for other text the browser's max_text_chars, 30000 by default); a truncated body comes with truncated: true and hint: its full length and the max_chars to pass (a truncated JSON is not parsed)" }
      required: [session, url]
  - name: put
    class: write
    untrusted: true
    description: "An HTTP PUT from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        body: { type: string, maxLength: 262144, description: "the request body (a JSON body gets Content-Type: application/json unless headers set it; CLI: --body_file <path>)" }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "the start of the response body to return, up to 1000000 characters (0 — the default: 200000 for JSON, for other text the browser's max_text_chars, 30000 by default); a truncated body comes with truncated: true and hint: its full length and the max_chars to pass (a truncated JSON is not parsed)" }
      required: [session, url]
  - name: patch
    class: write
    untrusted: true
    description: "An HTTP PATCH from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        body: { type: string, maxLength: 262144, description: "the request body (a JSON body gets Content-Type: application/json unless headers set it; CLI: --body_file <path>)" }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "the start of the response body to return, up to 1000000 characters (0 — the default: 200000 for JSON, for other text the browser's max_text_chars, 30000 by default); a truncated body comes with truncated: true and hint: its full length and the max_chars to pass (a truncated JSON is not parsed)" }
      required: [session, url]
  - name: delete
    class: write
    untrusted: true
    description: "An HTTP DELETE from the open page of the session (with the user's cookies) to an API of the site: changes data, so it needs the owner's approval unless a rule allows it (rules see url). The receipt records the method, address, status and size. Response — as browser.get: status, url, headers, json or body, size; redirect: true — a redirect was not followed"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open: the request goes from its page (its origin and cookies)" }
        url: { type: string, format: url, description: "an address on the allowed sites" }
        headers: { type: string, description: "JSON object of request headers, e.g. {\"Accept\":\"application/json\"}" }
        max_chars: { type: integer, minimum: 0, maximum: 1000000, description: "the start of the response body to return, up to 1000000 characters (0 — the default: 200000 for JSON, for other text the browser's max_text_chars, 30000 by default); a truncated body comes with truncated: true and hint: its full length and the max_chars to pass (a truncated JSON is not parsed)" }
      required: [session, url]
  # Скачивание: файл агенту в ответе (двоичный resource, как files.read) и
  # копия в доказательства. Класс write — действие кликает по странице, как act.
  - name: download
    class: write
    untrusted: true
    evidence: file
    description: "Download a file from the open page and get the file itself (not a path on the host): selector — click the element that downloads it (the site's own request with its headers and tokens; Chrome never shows a Save as dialog); response_url_contains — with selector, the file is the page's response to its own request with this in the address (for sites that show the file instead of downloading it; find it with browser.network); url — a GET from the page (its cookies, without its headers). Returns name, mime_type, size, sha256 and the file as a binary resource (CLI: --out <file> writes it to a file); a copy is kept as evidence. Up to 20 MB; the owner may narrow size and types"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        selector: { type: string, description: "CSS selector of the element that starts the download (a button, a link)" }
        text: { type: string, description: "with selector: the first visible element whose text contains it" }
        response_url_contains: { type: string, description: "with selector: the file is the body of the page's response whose address contains it (e.g. /api/3/document)" }
        url: { type: string, format: url, description: "instead of selector: a file on the allowed sites, fetched from the page with its cookies" }
        timeout_ms: { type: integer, minimum: 0, maximum: 120000, description: "how long to wait for the file after the click (0 — 30 s, up to 120 s)" }
    output_schema:
      type: object
      properties:
        name: { type: string, description: "file name (from the site; an extension by type is added when missing)" }
        mime_type: { type: string }
        size: { type: integer, description: bytes }
        sha256: { type: string, description: "hex sha256 of the file: compare with a saved copy (sha256sum)" }
        url: { type: string, description: "address of the file (not shown for blob: and data:)" }
        via: { type: string, enum: [download, response, fetch], description: "download — Chrome's download, response — the page's response, fetch — a request from the page" }
      required: [name, mime_type, size, sha256, via]
    example: gate4ai browser download --session s-… --selector '[data-testid="doc_download"]' --out doc.pdf
  # Вход по учётке владельца (credentials в конфигурации gate4ai): значения
  # секретов хост передаёт пакету только для этих двух действий, агенту и
  # коннектору они не видны. После ввода секрета страницу нельзя читать
  # (secret_on_page) до перехода верхнего документа.
  - name: login
    class: write
    description: "Sign in on the open sign-in page with an account the owner configured in gate4ai (credentials): its fields (constants and secrets from the vault) are entered and the form is submitted; the values are never shown. Status: logged_in, submitted or still_on_login (captcha, SMS code or a wrong password: tell the user to finish in the gate4ai Chrome window)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        account: { type: string, description: "the account alias (@name); connectors: also the slot from their credentials. Either account or via" }
        via: { type: string, description: "a login connector (login_required.via): sign in with the owner's account that uses it; none — credentials_required with the account to create" }
        timeout_ms: { type: integer, minimum: 0, maximum: 60000, description: "how long to wait for leaving the sign-in page (0 — 15 s)" }
    output_schema:
      type: object
      properties:
        url: { type: string, description: address after sign-in }
        status: { type: string, enum: [logged_in, submitted, still_on_login] }
        origin: { type: string, description: origin of the page the account was entered on }
      required: [status]
    example: gate4ai browser login --session s-… --account @example
  - name: fill_secret
    class: write
    description: "Enter one field of an account into a field of the open sign-in page without submitting (for multi-step sign-in); source: human asks the user for a code and types the answer in — it is not returned"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        account: { type: string, description: "the account alias (@name); connectors: also the slot from their credentials" }
        field: { type: string, description: "the account field: its name or secret alias (password, @example.password)" }
        selector: { type: string, description: "CSS selector of the page field: for the account's sign-in connector (via), or a password field when the owner set no selector; otherwise the owner's selector is used" }
        source: { type: string, enum: [account, human], description: "account (default) — the account field; human — a code the user types in" }
        prompt: { type: string, maxLength: 200, description: "source: human — the question for the user (the owner's question in the account wins)" }
      required: [account]
    output_schema:
      type: object
      properties:
        url: { type: string }
        origin: { type: string }
      required: [url]
  - name: page_screenshot
    class: read
    evidence: png
    description: "Screenshot of the open page: an element (selector — the first visible match), the visible window (viewport, the default) or the whole page (full_page). The PNG is stored as evidence (password fields are blacked out) and returned in content; agents also get it as a file: file in the result (the gate4ai data folder, browser-shots; CLI: --out <path> saves it where you say). An element that is not found is explained: whether the selector matched anything and why the matches are hidden (display:none, zero size, outside the page)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        selector: { type: string, description: "CSS selector of the element (the first visible one)" }
        viewport: { type: boolean, description: "the visible window (the default without selector)" }
        full_page: { type: boolean, description: "the whole page, beyond the window" }
    output_schema:
      type: object
      properties:
        file: { type: string, description: "agents: the PNG file (gate4ai data folder, browser-shots; with CLI --out — that path)" }
        mode: { type: string, enum: [element, viewport, full_page] }
        selector: { type: string }
        width: { type: integer, description: pixels }
        height: { type: integer, description: pixels }
        bytes: { type: integer, description: size of the PNG }
        url: { type: string }
      required: [mode, width, height, bytes]
    example: gate4ai browser page_screenshot --session s-… --viewport --out shot.png
  - name: dialog
    class: write
    description: "Answer the JavaScript dialog open on the page (alert, confirm, prompt, or beforeunload — «leave the page?»): while it is open the page does not respond, and every other action answers dialog_open {type, message}. accept presses OK (leave the page, confirm), dismiss — Cancel (stay); text — the answer to a prompt"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "agents: the session from browser.open" }
        accept: { type: boolean, description: "OK / leave / confirm" }
        dismiss: { type: boolean, description: "Cancel / stay" }
        text: { type: string, description: "prompt: the answer (with accept)" }
    output_schema:
      type: object
      properties:
        url: { type: string, description: "address after the answer" }
        dialog:
          type: object
          properties: { type: { type: string }, message: { type: string }, url: { type: string }, default_prompt: { type: string } }
          required: [type, message]
        accepted: { type: boolean }
      required: [url, dialog, accepted]
    example: gate4ai browser dialog --session s-… --dismiss
  - name: close
    class: read
    untrusted: true
    description: "End the browser session and free the page. Returns {session, closed: true, steps: <number of recorded steps>}; steps_file is the full record ({session, steps} with results) written to the gate4ai data folder — a test fixture for a connector (hosttest.LoadFixture, hosttest.Replay) and the source of connectors new --from-session; knowledge is the site's recipe gate4ai wrote from this session into the owner's knowledge folder ({recipe, status, sessions, hint}) — run the knowledge note command from its hint. steps: true adds step_list (action, args, status: ok or the error code — without results and page texts). all: true closes every session you started — this agent in this client (a lost id, a stuck session), not the sessions of other agents or of your other running copies: {closed: true, sessions: N}. A closed session answers not_found with who closed it, when and why (browser.close, idle for 10 minutes, the browser closed or crashed)"
    input_schema:
      type: object
      properties:
        session: { type: string, description: "the session from browser.open" }
        all: { type: boolean, description: "close all sessions you started instead (not those of other agents or clients)" }
        steps: { type: boolean, description: "list the steps: action, args (long values cut), status ok or the error code" }
