# Все цели — на 127.0.0.1 (сеть хоста).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: relay
    scrape_interval: 15s
    static_configs:
      - targets: [127.0.0.1:9464] # gate4ai-relay --metrics 127.0.0.1:9464
  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
  - job_name: loki
    static_configs:
      - targets: [127.0.0.1:3100]
  - job_name: tempo
    static_configs:
      - targets: [127.0.0.1:3200]
  - job_name: alloy
    static_configs:
      - targets: [127.0.0.1:12345]
  - job_name: grafana
    static_configs:
      - targets: [127.0.0.1:3000]
