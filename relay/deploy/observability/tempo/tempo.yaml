# Tempo в одном процессе, хранение на диске. OTLP принимается только с
# 127.0.0.1 (gate4ai-relay --otlp 127.0.0.1:4318).
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

memberlist:
  bind_addr: [127.0.0.1]

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318
        grpc:
          endpoint: 127.0.0.1:4317

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  compaction:
    block_retention: ${TRACES_RETENTION:-72h}

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 2000000
      burst_size_bytes: 4000000
      max_traces_per_user: 5000

usage_report:
  reporting_enabled: false
